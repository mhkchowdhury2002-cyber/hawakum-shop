
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY DOCS — Private Cloud</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:#eef5ff;
 font-family:Arial,sans-serif;
 background:radial-gradient(ellipse at top,#12376a,#071120 65%);
}
button,input{font:inherit}
button{cursor:pointer}
.wrap{width:min(100% - 28px,760px);margin:35px auto}
.card{
 background:rgba(12,28,51,.92);border:1px solid #29476b;
 border-radius:22px;padding:24px;box-shadow:0 18px 60px #0005;
}
.logo{font-size:27px;font-weight:800;letter-spacing:2px}
.logo span{color:#51b8ff}
.muted{color:#a8bed9;line-height:1.6}
h1{font-size:27px;margin:16px 0 8px}
label{display:block;margin:15px 0 7px;color:#d8e9ff}
input{
 width:100%;padding:13px;border-radius:10px;
 border:1px solid #355579;background:#09172b;color:white;
 outline:none;
}
input:focus{border-color:#50b9ff}
.btn{
 border:0;border-radius:10px;padding:13px 16px;
 background:linear-gradient(100deg,#1679ed,#36b8ff);
 color:white;font-weight:bold;
}
.btn:disabled{opacity:.5}
.full{width:100%;margin-top:17px}
.secondary{background:#193653;border:1px solid #355579}
.link{background:none;border:0;color:#62c5ff;padding:12px 0}
.hidden{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stats{padding:15px;background:#102643;border-radius:12px;margin:20px 0}
.file{
 display:flex;align-items:center;justify-content:space-between;
 gap:10px;padding:14px 0;border-bottom:1px solid #29415d;
 overflow-wrap:anywhere;
}
.file:last-child{border:0}
.file-name{font-weight:600;overflow-wrap:anywhere}
.small{font-size:12px;color:#a8bed9;margin-top:5px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.actions button{padding:8px 10px;font-size:13px}
#notice{padding:12px;border-radius:9px;margin:14px 0;overflow-wrap:anywhere}
#notice:empty{display:none}
.ok{background:#123d35;color:#a5ffe2}
.err{background:#512a36;color:#ffd2d9}
#drop{border:1px dashed #4a83b9;padding:20px;border-radius:13px;margin-top:16px}
.glow{animation:appear .7s ease both}
@keyframes appear{
 from{opacity:0;transform:translateY(15px)}
 to{opacity:1;transform:translateY(0)}
}
@media(max-width:480px){
 .wrap{margin:16px auto}.card{padding:18px}
 h1{font-size:23px}.file{align-items:flex-start;flex-direction:column}
 .top{align-items:flex-start}.logo{font-size:23px}
}
</style>
</head>
<body>
<main class="wrap">
  <section id="auth" class="card glow">
    <div class="logo">MY <span>DOCS</span></div>
    <p class="muted">আপনার গুরুত্বপূর্ণ ডকুমেন্ট, এক নিরাপদ জায়গায়।</p>
    <h1 id="authTitle">স্বাগতম!</h1>
    <p class="muted" id="authDesc">আপনার ব্যক্তিগত ফাইলে প্রবেশ করতে লগইন করুন।</p>
    <div id="notice" role="status"></div>
    <form id="authForm">
      <label for="email">ইমেইল</label>
      <input id="email" type="email" autocomplete="email"
       placeholder="you@example.com" required>
      <label for="password">পাসওয়ার্ড</label>
      <input id="password" type="password"
       autocomplete="current-password" minlength="8"
       placeholder="কমপক্ষে ৮ অক্ষর" required>
      <button id="authBtn" class="btn full" type="submit">লগইন করুন</button>
    </form>
    <button id="switchAuth" class="link" type="button">
      নতুন অ্যাকাউন্ট তৈরি করুন
    </button>
  </section>

  <section id="dashboard" class="card hidden glow">
    <div class="top">
      <div>
        <div class="logo">MY <span>DOCS</span></div>
        <p class="muted">আপনার ব্যক্তিগত ডকুমেন্ট ভল্ট</p>
      </div>
      <button id="logout" class="btn secondary">লগআউট</button>
    </div>
    <div id="notice2" role="status"></div>
    <div class="stats">
      <div class="muted">লগইন করা অ্যাকাউন্ট</div>
      <div id="userEmail" style="overflow-wrap:anywhere"></div>
      <div class="muted" style="margin-top:12px">আপনার ফাইল</div>
      <strong id="count">0</strong>
    </div>
    <h2>নতুন ডকুমেন্ট সেভ করুন</h2>
    <form id="uploadForm">
      <label for="docName">ডকুমেন্টের নাম (ঐচ্ছিক)</label>
      <input id="docName" maxlength="100"
       placeholder="যেমন: Passport Copy">
      <label for="fileInput">ফাইল নির্বাচন করুন</label>
      <input id="fileInput" type="file" required
       accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
      <p class="small">PDF, JPG, PNG, DOC, DOCX — সর্বোচ্চ ১০ MB।</p>
      <button class="btn full" id="uploadBtn" type="submit">
        ☁️ আপলোড ও সেভ করুন
      </button>
    </form>
    <div id="drop">
      <h2>আমার ডকুমেন্ট</h2>
      <input id="search" type="search"
       placeholder="ডকুমেন্ট খুঁজুন...">
      <div id="files" class="muted">ফাইল লোড হচ্ছে...</div>
      <button id="refresh" class="btn secondary full" type="button">
        তালিকা রিফ্রেশ
      </button>
    </div>
  </section>
</main>

<script>
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";
const BUCKET = "my-docs";
const MAX_SIZE = 10 * 1024 * 1024;
const ALLOWED = [
  "pdf", "jpg", "jpeg", "png", "doc", "docx"
];

const $ = id => document.getElementById(id);
const authPanel = $("auth");
const dash = $("dashboard");
const notice = $("notice");
const notice2 = $("notice2");

let client;
let currentUser = null;
let isRegister = false;
let allFiles = [];
let busy = false;

function message(text, error=false, target=notice) {
  target.textContent = text;
  target.className = text ? (error ? "err" : "ok") : "";
}
function safeError(error) {
  console.error(error);
  return error?.message || "কাজটি সম্পন্ন হয়নি। আবার চেষ্টা করুন।";
}
function setBusy(value) {
  busy = value;
  $("authBtn").disabled = value;
  $("uploadBtn").disabled = value;
  $("logout").disabled = value;
}
function showAuth() {
  currentUser = null;
  allFiles = [];
  authPanel.classList.remove("hidden");
  dash.classList.add("hidden");
}
function showDashboard(user) {
  currentUser = user;
  authPanel.classList.add("hidden");
  dash.classList.remove("hidden");
  $("userEmail").textContent = user.email || "Logged in";
  $("count").textContent = "…";
  loadFiles();
}

function updateAuthMode() {
  $("authTitle").textContent =
    isRegister ? "নতুন অ্যাকাউন্ট" : "স্বাগতম!";
  $("authDesc").textContent = isRegister
    ? "আপনার ব্যক্তিগত অ্যাকাউন্ট তৈরি করুন।"
    : "আপনার ব্যক্তিগত ফাইলে প্রবেশ করতে লগইন করুন।";
  $("authBtn").textContent =
    isRegister ? "অ্যাকাউন্ট তৈরি করুন" : "লগইন করুন";
  $("switchAuth").textContent = isRegister
    ? "আগে অ্যাকাউন্ট আছে? লগইন করুন"
    : "নতুন অ্যাকাউন্ট তৈরি করুন";
  $("password").autocomplete =
    isRegister ? "new-password" : "current-password";
}
$("switchAuth").addEventListener("click", () => {
  isRegister = !isRegister;
  message("");
  updateAuthMode();
});

async function init() {
  if (SUPABASE_URL.startsWith("YOUR_") ||
      SUPABASE_KEY.startsWith("YOUR_")) {
    message("প্রথমে কোডে আপনার Supabase URL ও Publishable Key বসান.", true);
    return;
  }

  try {
    client = window.supabase.createClient(
      SUPABASE_URL, SUPABASE_KEY,
      { auth: { persistSession: true, autoRefreshToken: true } }
    );

    client.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT") {
        showAuth();
      } else if (session?.user) {
        showDashboard(session.user);
      }
    });

    const { data, error } = await client.auth.getSession();
    if (error) throw error;
    if (data.session?.user) showDashboard(data.session.user);
  } catch (e) {
    message(safeError(e), true);
  }
}

$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!client || busy) return;
  message("");
  setBusy(true);

  try {
    const email = $("email").value.trim();
    const password = $("password").value;
    let result;

    if (isRegister) {
      result = await client.auth.signUp({ email, password });
      if (result.error) throw result.error;

      if (!result.data.session) {
        message("অ্যাকাউন্ট তৈরি হয়েছে। ইমেইল যাচাই করে তারপর লগইন করুন.");
      } else if (result.data.user) {
        showDashboard(result.data.user);
      }
    } else {
      result = await client.auth.signInWithPassword({
        email, password
      });
      if (result.error) throw result.error;
      showDashboard(result.data.user);
    }
  } catch (e) {
    message(safeError(e), true);
  } finally {
    setBusy(false);
  }
});

function extension(name) {
  return (name.split(".").pop() || "").toLowerCase();
}
function validFile(file) {
  if (!file) throw new Error("একটি ফাইল নির্বাচন করুন।");
  if (file.size > MAX_SIZE)
    throw new Error("ফাইলটি ১০ MB-এর চেয়ে বড়।");
  if (!ALLOWED.includes(extension(file.name)))
    throw new Error("এই ফাইলের ধরন অনুমোদিত নয়।");
}
function cleanName(name) {
  return name.normalize("NFKC")
    .replace(/[\/\\\u0000-\u001f\u007f]/g, "_")
    .trim().slice(0, 100) || "document";
}

$("uploadForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!client || !currentUser || busy) return;
  message("", false, notice2);
  setBusy(true);

  try {
    const file = $("fileInput").files[0];
    validFile(file);

    const ext = extension(file.name);
    const id = crypto.randomUUID();
    const path = `${currentUser.id}/${id}.${ext}`;

    const { error } = await client.storage.from(BUCKET).upload(
      path, file, {
        upsert: false,
        contentType: file.type || "application/octet-stream",
        cacheControl: "3600",
        metadata: {
          original_name: cleanName(
            $("docName").value.trim() || file.name
          )
        }
      }
    );
    if (error) throw error;

    $("fileInput").value = "";
    $("docName").value = "";
    message("ফাইল ক্লাউডে সেভ হয়েছে।", false, notice2);
    await loadFiles();
  } catch (e) {
    message(safeError(e), true, notice2);
  } finally {
    setBusy(false);
  }
});

async function loadFiles() {
  if (!client || !currentUser) return;

  $("files").textContent = "ফাইল লোড হচ্ছে...";
  try {
    const { data, error } = await client.storage.from(BUCKET)
      .list(currentUser.id, {
        limit: 100,
        offset: 0,
        sortBy: { column: "created_at", order: "desc" }
      });
    if (error) throw error;

    allFiles = (data || []).filter(
      f => f.name && !f.name.startsWith(".")
    );
    $("count").textContent = String(allFiles.length);
    renderFiles();
  } catch (e) {
    $("files").textContent = safeError(e);
  }
}

function renderFiles() {
  const query = $("search").value.trim().toLowerCase();
  const filtered = allFiles.filter(f =>
    f.name.toLowerCase().includes(query)
  );
  const container = $("files");
  container.replaceChildren();

  if (!filtered.length) {
    container.textContent = allFiles.length
      ? "মিল পাওয়া যায়নি।"
      : "এখনো কোনো ডকুমেন্ট নেই। প্রথম ফাইল আপলোড করুন।";
    return;
  }

  filtered.forEach(f => {
    const row = document.createElement("div");
    row.className = "file";

    const info = document.createElement("div");
    info.style.minWidth = "0";
    const name = document.createElement("div");
    name.className = "file-name";
    name.textContent = f.name;
    const meta = document.createElement("div");
    meta.className = "small";
    meta.textContent = f.created_at
      ? new Date(f.created_at).toLocaleString()
      : "Private document";
    info.append(name, meta);

    const actions = document.createElement("div");
    actions.className = "actions";
    const download = document.createElement("button");
    download.className = "btn";
    download.textContent = "ডাউনলোড";
    download.addEventListener("click", () => downloadFile(f.name));

    const del = document.createElement("button");
    del.className = "btn secondary";
    del.textContent = "মুছুন";
    del.addEventListener("click", () => deleteFile(f.name));

    actions.append(download, del);
    row.append(info, actions);
    container.append(row);
  });
}

async function downloadFile(name) {
  if (!currentUser) return;
  message("", false, notice2);

  try {
    const path = `${currentUser.id}/${name}`;
    const { data, error } = await client.storage.from(BUCKET)
      .createSignedUrl(path, 60);
    if (error) throw error;

    const a = document.createElement("a");
    a.href = data.signedUrl;
    a.download = name;
    a.rel = "noopener";
    document.body.append(a);
    a.click();
    a.remove();
  } catch (e) {
    message(safeError(e), true, notice2);
  }
}

async function deleteFile(name) {
  if (!currentUser) return;
  if (!confirm(`"${name}" ফাইলটি মুছে ফেলবেন?`)) return;

  try {
    const path = `${currentUser.id}/${name}`;
    const { error } = await client.storage.from(BUCKET)
      .remove([path]);
    if (error) throw error;

    message("ফাইল মুছে ফেলা হয়েছে।", false, notice2);
    await loadFiles();
  } catch (e) {
    message(safeError(e), true, notice2);
  }
}

$("search").addEventListener("input", renderFiles);
$("refresh").addEventListener("click", loadFiles);

$("logout").addEventListener("click", async () => {
  if (!client || busy) return;
  setBusy(true);
  try {
    const { error } = await client.auth.signOut();
    if (error) throw error;
    showAuth();
  } catch (e) {
    message(safeError(e), true, notice2);
  } finally {
    setBusy(false);
  }
});

updateAuthMode();
init();
</script>
</body>
</html>
